name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ clang-tidy

    - name: Configure CMake
      uses: threeal/cmake-action@v2
      with:
        build-args: -B build

    - name: Build
      uses: threeal/cmake-action@v2
      with:
        action: build
        build-args: --config Release

    - name: Run clang-tidy
      run: |
        clang-tidy homework.cpp -- -std=c++11 || true

    - name: Test
      run: |
        echo "hello world test." | ./build/homework || true
